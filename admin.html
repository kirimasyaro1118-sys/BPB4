<!DOCTYPE html>
<html lang="ja">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理画面 - メンテナンス中</title>
    <style>
        body {
            background-color: #0f1117;
            color: #f8fafc;
            font-family: sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .box {
            padding: 32px;
            background: rgba(26, 31, 46, 0.85);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>🛠️ 管理画面はメンテナンス中です</h2>
        <p style="color: #94a3b8; margin-top: 12px;">システムアップデート中のためアクセスを一時制限しております。</p>
    </div>
</body>
</html>
