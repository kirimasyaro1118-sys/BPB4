<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>エッグスシミュ - メンテナンス中 / 一時非公開</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1117;
            --card-bg: rgba(26, 31, 46, 0.85);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-gold: #f59e0b;
            --accent-glow: rgba(245, 158, 11, 0.25);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(245, 158, 11, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(99, 102, 241, 0.08) 0%, transparent 40%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
        }

        .maintenance-container {
            max-width: 620px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 48px 36px;
            text-align: center;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6),
                0 0 40px var(--accent-glow);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: relative;
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .icon-wrapper {
            position: relative;
            width: 96px;
            height: 96px;
            margin: 0 auto 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pulse-ring {
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid var(--accent-gold);
            opacity: 0.4;
            animation: pulseRing 2.4s ease-out infinite;
        }

        @keyframes pulseRing {
            0% {
                transform: scale(0.9);
                opacity: 0.8;
            }
            70% {
                transform: scale(1.35);
                opacity: 0;
            }
            100% {
                transform: scale(1.35);
                opacity: 0;
            }
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #2d1a0e, #1a1625);
            border: 1px solid rgba(245, 158, 11, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            animation: floatIcon 3s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #fbbf24;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #fbbf24;
            animation: blink 1.4s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-bottom: 14px;
            line-height: 1.3;
            background: linear-gradient(135deg, #ffffff 40%, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.lead {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .status-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
            margin-bottom: 32px;
        }

        .status-box-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .status-box-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .status-box-desc span {
            color: #e2e8f0;
            font-weight: 600;
        }

        .footer-note {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .footer-brand {
            margin-top: 24px;
            font-size: 12px;
            color: rgba(148, 163, 184, 0.6);
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="icon-wrapper">
            <div class="pulse-ring"></div>
            <div class="icon-circle">🛠️</div>
        </div>

        <div class="badge">
            <span class="badge-dot"></span>
            Maintenance Mode
        </div>

        <h1>ただいまメンテナンス中です</h1>
        <p class="lead">
            仕様調整およびシステムアップデート作業を実施するため、<br>
            エッグスシミュを一時的に非公開としております。
        </p>

        <div class="status-box">
            <div class="status-box-header">
                <span>🍳</span>
                <span>現在の状況</span>
            </div>
            <div class="status-box-desc">
                現在、<span>アイテム発動順序の改善</span>や<span>動作仕様の最適化・検証作業</span>を行っております。<br>
                作業完了および再開の準備が整い次第、公開を再開いたします。
            </div>
        </div>

        <p class="footer-note">
            ご利用の皆様にはご不便をおかけいたしますが、再開までしばらくお待ちくださいますようお願い申し上げます。
        </p>

        <div class="footer-brand">
            Eggscalibur Simulator &bull; Backpack Battles Verification
        </div>
    </div>
</body>
</html>
